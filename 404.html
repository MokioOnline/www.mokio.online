<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Mokio</title>
  <meta name="description" content="This page doesn't exist. Head back to Mokio — Music, Messaging & More.">
  <link rel="icon" href="https://www.mokio.online/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0c10;
      --bg-elevated: #12141a;
      --bg-card: #171a22;
      --text: #e9ebf0;
      --text-muted: #8f96a3;
      --accent: #5b7fd4;
      --accent-2: #4c85cc;
      --title-gradient: linear-gradient(135deg, #e03550 0%, #4c85cc 100%);
      --border: rgba(255, 255, 255, 0.075);
      --radius: 14px;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Space Grotesk', 'Inter', sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(8, 8, 20, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: block;
      flex-shrink: 0;
      object-fit: contain;
    }

    .logo-text {
      background: var(--title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    /* Main */
    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .error-page::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse at 50% 0%, rgba(110, 124, 240, 0.1) 0%, transparent 65%);
      pointer-events: none;
    }

    .error-content {
      text-align: center;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(96px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      user-select: none;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 17px;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 15px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--title-gradient);
      color: #fff;
      box-shadow: 0 2px 12px rgba(224, 53, 80, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(76, 133, 204, 0.28);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Footer */
    .footer {
      padding: 24px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--text);
    }

    /* Subtle pulse on the 404 */
    @keyframes soft-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .error-code {
      animation: soft-pulse 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="https://www.mokio.online/" class="logo">
        <img src="https://www.mokio.online/images/logo.svg" alt="Mokio" class="logo-img">
        <span class="logo-text">Mokio</span>
      </a>
    </div>
  </header>

  <main class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-message">
        This page doesn’t exist — or it moved.<br>
        Let’s get you back to music, messaging, and more.
      </p>
      <div class="error-actions">
        <a href="https://www.mokio.online/" class="btn btn-primary">Back to Home</a>
        <a href="https://www.mokio.online/#features" class="btn btn-secondary">Explore Features</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© Mokio · <a href="https://www.mokio.online/">mokio.online</a></p>
  </footer>
</body>
</html>
